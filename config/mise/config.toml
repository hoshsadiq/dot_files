[tools."github:sharkdp/bat"]
version = "latest"
# language=shell script
postinstall = """
mkdir -p $MISE_TOOL_INSTALL_PATH/functions $MISE_TOOL_INSTALL_PATH/share/man/man1
mv $MISE_TOOL_INSTALL_PATH/autocomplete/bat.zsh $MISE_TOOL_INSTALL_PATH/functions/_bat
mv $MISE_TOOL_INSTALL_PATH/*.1 $MISE_TOOL_INSTALL_PATH/share/man/man1/
"""
[tools."github:eth-p/bat-extras"]
version = "latest"
# language=shell script
postinstall = """
mkdir -p $MISE_TOOL_INSTALL_PATH/share/man/man1
mv $MISE_TOOL_INSTALL_PATH/man/*.1 $MISE_TOOL_INSTALL_PATH/share/man/man1/
"""

[tools."github:sharkdp/fd"]
version = "latest"
# language=shell script
postinstall = """
mkdir -p $MISE_TOOL_INSTALL_PATH/functions $MISE_TOOL_INSTALL_PATH/share/man/man1
mv $MISE_TOOL_INSTALL_PATH/autocomplete/_fd $MISE_TOOL_INSTALL_PATH/functions/_fd
mv $MISE_TOOL_INSTALL_PATH/*.1 $MISE_TOOL_INSTALL_PATH/share/man/man1/
"""

[hooks.enter]
shell = "zsh"
script = '''
echo > /tmp/wot.enter.log
printenv >> /tmp/wot.enter.log
mise list --json | jq -r '[.[] | map(.install_path)[]]' >> /tmp/wot.enter.log
'''
[hooks.leave]
shell = "zsh"
script = '''
echo > /tmp/wot.leave.log
printenv >> /tmp/wot.leave.log
mise list --json | jq -r '[.[] | map(.install_path)[]]' >> /tmp/wot.leave.log
'''

[settings]
idiomatic_version_file_enable_tools = ["go", "node"]
experimental = true
