[tools."kubectx"]
version = "latest"
postinstall = """
version="$(basename "$MISE_TOOL_INSTALL_PATH")"
mkdir -p $MISE_TOOL_INSTALL_PATH/functions

targs=()
tar --version 2>/dev/null | grep -qi gnu && targs=(--wildcards)

curl -fsSL https://github.com/ahmetb/kubectx/archive/refs/tags/v${version}.tar.gz -o- |
  tar --extract --gzip --verbose --file=- --to-stdout ${targs[@]} '*/completion/_kubectx.zsh' > "$MISE_TOOL_INSTALL_PATH/functions/_kubectx"
"""

[tools."kubens"]
