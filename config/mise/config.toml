# Google publishes no JSON version endpoint; only repository2-3.xml.
# Check for updates: https://developer.android.com/tools/releases/platform-tools
[tools."http:platform-tools"]
version = "latest"
version_list_url = "https://dl.google.com/android/repository/repository2-3.xml"
version_regex = 'platform-tools_r([0-9]+\.[0-9]+\.[0-9]+)-darwin\.zip'
url = 'https://dl.google.com/android/repository/platform-tools_r{{ version }}-{{ os(macos="darwin", windows="win") }}.zip'

