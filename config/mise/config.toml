[tools."http:helm"]
version = "4.2.3"
version_list_url = "https://api.github.com/repos/helm/helm/releases"
version_json_path = ".[].tag_name"
url = 'https://get.helm.sh/helm-v{{ version }}-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz'
postinstall = """
mkdir -p $MISE_TOOL_INSTALL_PATH/functions
helm completion zsh > "$MISE_TOOL_INSTALL_PATH/functions/_helm"
"""


[tools."awscli"]
version = "latest"
postinstall = """
mkdir -p $MISE_TOOL_INSTALL_PATH/functions
aws_completer=$(find "$MISE_TOOL_INSTALL_PATH" -name "aws_completer" -type f 2>/dev/null | head -1)
if [[ -n "$aws_completer" && -x "$aws_completer" ]]; then
  cat > "$MISE_TOOL_INSTALL_PATH/functions/_aws" <<EOF
#compdef aws
# AWS CLI completion using bash completer
# This file needs to be sourced (not autoloaded) to execute complete -C
# The __load_mise_extras function will handle sourcing files that contain complete -C
complete -C "$aws_completer" aws
EOF
fi
"""

[tools."github:atuinsh/atuin"]
version = "latest"
postinstall = """
mkdir -p $MISE_TOOL_INSTALL_PATH/functions
atuin gen-completions --shell zsh > "$MISE_TOOL_INSTALL_PATH/functions/_atuin"
"""

[tools."github:ajeetdsouza/zoxide"]
version = "latest"
postinstall = """
mkdir -p "$MISE_TOOL_INSTALL_PATH/functions"
ln -fs ../completions/_zoxide "$MISE_TOOL_INSTALL_PATH/functions/_zoxide"
zoxide init zsh --cmd cd > "$MISE_TOOL_INSTALL_PATH/init.zsh"
# --cmd cd replaces z/zi with cd/cdi; add z/zi back as aliases
cat >> "$MISE_TOOL_INSTALL_PATH/init.zsh" << 'EOF'
alias z=__zoxide_z
alias zi=__zoxide_zi
EOF
zsh -c 'zcompile -UR "$0/init.zsh"' "$MISE_TOOL_INSTALL_PATH"
"""

[tools."python"]
