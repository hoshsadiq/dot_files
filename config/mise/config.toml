[settings]
idiomatic_version_file_enable_tools = ["go", "node"]
experimental = true
fetch_remote_versions_timeout = "30s"

[task_config]
# File tasks live in the repo so they are versioned with the rest of the config;
# the default dir is kept so ad-hoc tasks in ~/.config/mise/tasks still work.
includes = [".config/mise/tasks", "dot_files/config/mise/tasks"]
